<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMALIA | الروابط الرسمية</title>
    <!-- خط Cairo من جوجل لمظهر عصري وفخم -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet">
    <!-- مكتبة أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f9e8a2;
            --dark-bg: #0b0b0e;
            --card-bg: rgba(20, 20, 25, 0.88);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 20% 10%, rgba(212, 175, 55, 0.14) 0%, transparent 45%),
                radial-gradient(circle at 80% 90%, rgba(212, 175, 55, 0.08) 0%, transparent 45%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            color: #ffffff;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 430px;
            border-radius: 34px;
            padding: 45px 26px 32px;
            text-align: center;
            box-shadow: 
                0 25px 55px rgba(0, 0, 0, 0.75),
                0 0 0 1px rgba(212, 175, 55, 0.22),
                inset 0 1px 1px rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(25px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* إطار اللوجو الفخم بحجم كبير وواضح */
        .logo-wrapper {
            width: 190px;
            height: 190px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 6px;
            background: linear-gradient(135deg, #ffffff 0%, var(--gold-primary) 50%, #ffffff 100%);
            box-shadow: 
                0 14px 35px rgba(0, 0, 0, 0.6),
                0 0 28px rgba(212, 175, 55, 0.28);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .logo-wrapper:hover {
            transform: scale(1.04);
            box-shadow: 
                0 18px 45px rgba(0, 0, 0, 0.75),
                0 0 38px rgba(212, 175, 55, 0.45);
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background: #ffffff;
            display: block;
        }

        .brand-title {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 3.5px;
            margin-bottom: 32px;
            background: linear-gradient(to right, #ffffff, var(--gold-light), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 800;
            color: #fff;
            transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        /* لمعة فخمة تتحرك على الأزرار */
        .social-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 55%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.22), transparent);
            transform: skewX(-25deg);
            transition: 0.65s;
        }

        .social-btn:hover::before {
            left: 130%;
        }

        .social-btn i.icon-main {
            font-size: 26px;
            width: 32px;
            text-align: center;
        }

        .social-btn i.icon-arrow {
            font-size: 15px;
            opacity: 0.85;
            transition: transform 0.3s ease;
        }

        .social-btn:hover {
            transform: translateY(-4px);
        }

        .social-btn:hover i.icon-arrow {
            transform: translateX(-6px);
        }

        /* تصميم زر فيسبوك */
        .btn-facebook {
            background: linear-gradient(135deg, #1877F2 0%, #094ca3 100%);
            box-shadow: 0 10px 25px rgba(24, 119, 242, 0.3);
        }

        .btn-facebook:hover {
            box-shadow: 0 14px 32px rgba(24, 119, 242, 0.5);
        }

        /* تصميم زر انستجرام */
        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            box-shadow: 0 10px 25px rgba(220, 39, 67, 0.3);
        }

        .btn-instagram:hover {
            box-shadow: 0 14px 32px rgba(220, 39, 67, 0.5);
        }

        /* قسم زر Tapio الصغير للتواصل عبر واتساب */
        .tapio-section {
            margin-top: 34px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
        }

        .tapio-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 50px;
            background: rgba(37, 211, 102, 0.08);
            border: 1px solid rgba(37, 211, 102, 0.35);
            color: #d1d5db;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .tapio-btn i {
            color: #25D366;
            font-size: 17px;
        }

        .tapio-btn .tapio-name {
            color: #25D366;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .tapio-btn:hover {
            background: #25D366;
            color: #0b0b0e;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35);
            transform: translateY(-2px);
        }

        .tapio-btn:hover i,
        .tapio-btn:hover .tapio-name {
            color: #0b0b0e;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- صورة اللوجو بحجم كبير (يبحث الكود تلقائياً عن الاسم الصحيح للصورة) -->
        <div class="logo-wrapper">
            <img id="brandLogo" src="logo.png" alt="AMALIA Logo">
        </div>

        <h1 class="brand-title">AMALIA</h1>

        <div class="links-list">
            <!-- رابط فيسبوك -->
            <a href="https://www.facebook.com/share/1DndWjMiZq/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" class="social-btn btn-facebook">
                <i class="fab fa-facebook-f icon-main"></i>
                <span>تابعينا علي فيس بوك</span>
                <i class="fas fa-chevron-left icon-arrow"></i>
            </a>

            <!-- رابط انستجرام -->
            <a href="https://www.instagram.com/amalia_20255?psln=MThjNmNzcWRzeHV1NA%3D%3D&utm_source=qr" target="_blank" rel="noopener noreferrer" class="social-btn btn-instagram">
                <i class="fab fa-instagram icon-main"></i>
                <span>اعمليلنا فولو علي الانستجرام</span>
                <i class="fas fa-chevron-left icon-arrow"></i>
            </a>
        </div>

        <!-- زر صغير لطلب Tapio عبر واتساب -->
        <div class="tapio-section">
            <a href="https://wa.me/201284424161?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D9%8B%D8%8C%20%D8%B9%D8%AC%D8%A8%D9%86%D9%8A%20%D8%AA%D8%B5%D9%85%D9%8A%D9%85%20Tapio%20%D9%88%D8%B9%D8%A7%D9%88%D8%B2%20%D8%A3%D8%B7%D9%84%D8%A8%20%D9%88%D8%A7%D8%AD%D8%AF%20%D8%AE%D8%A7%D8%B5%20%D8%A8%D9%8A!" target="_blank" rel="noopener noreferrer" class="tapio-btn">
                <i class="fab fa-whatsapp"></i>
                <span>عجبك <span class="tapio-name">Tapio</span>؟ اطلبه الآن عبر واتساب</span>
            </a>
        </div>
    </div>

    <!-- كود ذكي لضمان ظهور اللوجو أياً كانت صيغة الصورة المرفوعة -->
    <script>
        const logoImg = document.getElementById('brandLogo');
        const possibleNames = ['logo.jpg', 'logo.jpeg', 'image.png', 'image.jpg', 'Logo.png', 'Logo.jpg'];
        let currentTry = 0;

        logoImg.onerror = function() {
            if (currentTry < possibleNames.length) {
                logoImg.src = possibleNames[currentTry];
                currentTry++;
            }
        };
    </script>

</body>
</html>
