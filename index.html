<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMALIA | تواصل معنا</title>
    <!-- خط Cairo من جوجل لمظهر عصري وأنيق -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- مكتبة أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary-black: #1a1a1a;
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --card-bg: rgba(255, 255, 255, 0.92);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--primary-black);
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            border-radius: 28px;
            padding: 40px 25px 30px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.06);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.7s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-wrapper {
            width: 145px;
            height: 145px;
            margin: 0 auto 18px;
            border-radius: 50%;
            padding: 5px;
            background: #fff;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            transition: transform 0.3s ease;
        }

        .logo-wrapper:hover {
            transform: scale(1.04);
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .brand-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 6px;
            color: #111;
        }

        .brand-subtitle {
            font-size: 15px;
            color: #666;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 22px;
            border-radius: 18px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .social-btn i.icon-main {
            font-size: 24px;
            width: 30px;
            text-align: center;
        }

        .social-btn i.icon-arrow {
            font-size: 14px;
            opacity: 0.8;
            transition: transform 0.3s ease;
        }

        .social-btn:hover {
            transform: translateY(-3px);
        }

        .social-btn:hover i.icon-arrow {
            transform: translateX(-5px);
        }

        /* تصميم زر فيسبوك */
        .btn-facebook {
            background: linear-gradient(135deg, #1877F2 0%, #0d5cb6 100%);
            box-shadow: 0 8px 20px rgba(24, 119, 242, 0.25);
        }

        .btn-facebook:hover {
            box-shadow: 0 12px 25px rgba(24, 119, 242, 0.38);
        }

        /* تصميم زر انستجرام */
        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            box-shadow: 0 8px 20px rgba(220, 39, 67, 0.25);
        }

        .btn-instagram:hover {
            box-shadow: 0 12px 25px rgba(220, 39, 67, 0.38);
        }

        /* زر مشاركة الصفحة */
        .btn-share {
            background: #f3f4f6;
            color: #333;
            border: 1px solid #e5e7eb;
            margin-top: 5px;
            cursor: pointer;
        }

        .btn-share:hover {
            background: #e5e7eb;
        }

        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #999;
            font-weight: 600;
        }

        .heart {
            color: #e25555;
            display: inline-block;
            animation: beat 1.2s infinite alternate;
        }

        @keyframes beat {
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- صورة اللوجو (تأكد من تسمية صورة اللوجو logo.png في نفس الفولدر) -->
        <div class="logo-wrapper">
            <img src="logo.png" alt="AMALIA Logo">
        </div>

        <h1 class="brand-title">AMALIA</h1>
        <p class="brand-subtitle">أهلاً بكِ في عالم أماليا ✨ تابعينا لمعرفة أحدث الموديلات</p>

        <div class="links-list">
            <!-- رابط فيسبوك -->
            <a href="https://www.facebook.com/share/1DndWjMiZq/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" class="social-btn btn-facebook">
                <i class="fab fa-facebook-f icon-main"></i>
                <span>صفحتنا على فيسبوك</span>
                <i class="fas fa-chevron-left icon-arrow"></i>
            </a>

            <!-- رابط انستجرام -->
            <a href="https://www.instagram.com/amalia_20255?psln=MThjNmNzcWRzeHV1NA%3D%3D&utm_source=qr" target="_blank" rel="noopener noreferrer" class="social-btn btn-instagram">
                <i class="fab fa-instagram icon-main"></i>
                <span>حسابنا على إنستجرام</span>
                <i class="fas fa-chevron-left icon-arrow"></i>
            </a>

            <!-- زر مشاركة الصفحة -->
            <button onclick="sharePage()" class="social-btn btn-share">
                <i class="fas fa-share-nodes icon-main"></i>
                <span>مشاركة الصفحة مع أصدقائك</span>
                <i class="fas fa-chevron-left icon-arrow"></i>
            </button>
        </div>

        <div class="footer">
            صُنع بكل <span class="heart">♥</span> لعملاء AMALIA
        </div>
    </div>

    <script>
        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: 'AMALIA',
                    text: 'تابعوا أحدث الموديلات على صفحات AMALIA الرسمية!',
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('تم نسخ رابط الصفحة بنجاح!');
            }
        }
    </script>

</body>
</html>
